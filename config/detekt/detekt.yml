build:
  maxIssues: 0
  weights:
    complexity: 1
    formatting: 1
    style: 1

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable', 'Test']

style:
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']
  UnusedImports:
    active: true
  UnusedParameter:
    active: true
    ignoreAnnotated: ['Composable']
  MagicNumber:
    active: true
    ignoreAnnotated: ['Composable']
    ignoreNumbers: ['-1', '0', '1', '2']
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  ForbiddenImport:
    active: true
    imports:
      - value: 'coil3.compose.AsyncImage'
        reason: 'Todas as imagens devem passar pelo componente centralizado MoviePoster em core:ui'
      - value: 'coil3.compose.rememberAsyncImagePainter'
        reason: 'Use MoviePoster em core:ui para evitar duplicação de ImageLoader'
