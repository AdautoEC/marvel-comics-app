name: PR Verification

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy fake google-services.json for CI
        run: |
          mkdir -p app
          cp ci/google-services.fake.json app/google-services.json

      - name: Setup local.properties with TMDB Secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          echo "tmdb.api.key=${TMDB_API_KEY:-[REDACTED_API_KEY]}" >> local.properties
          echo "tmdb.read.access.token=${TMDB_READ_ACCESS_TOKEN}" >> local.properties

      - name: Run checks and assemble
        run: ./gradlew detekt lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace
