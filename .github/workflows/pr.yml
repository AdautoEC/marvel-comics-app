name: PR Verification

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Copy fake google-services.json for CI
        run: |
          mkdir -p app
          cp ci/google-services.fake.json app/google-services.json

      - name: Setup local.properties with TMDB Secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          echo "tmdb.api.key=${TMDB_API_KEY}" >> local.properties
          echo "tmdb.read.access.token=${TMDB_READ_ACCESS_TOKEN}" >> local.properties

      - name: Run static analysis, lint, and tests
        run: ./gradlew checkNoHardcodedStrings detekt lintDebug testDebugUnitTest koverXmlReport koverHtmlReport --stacktrace

      - name: Assemble APKs and Benchmark build
        run: ./gradlew :benchmark:assembleBenchmark assembleDebug assembleRelease --stacktrace

      - name: Upload Kover Coverage Report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: kover-coverage-report
          path: build/reports/kover/
