name: Main CD Pipeline (Test Lab, App Distribution & Release)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy fake google-services.json for CI
        run: |
          mkdir -p app
          cp ci/google-services.fake.json app/google-services.json

      - name: Setup local.properties with TMDB Secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          echo "tmdb.api.key=${TMDB_API_KEY:-[REDACTED_API_KEY]}" >> local.properties
          echo "tmdb.read.access.token=${TMDB_READ_ACCESS_TOKEN}" >> local.properties

      - name: Run Detekt, Lint & Unit Tests
        run: ./gradlew detekt lintDebug testDebugUnitTest --stacktrace

  build:
    name: Build Release & Test APKs
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          else
            echo "Secrets not found; using ci/google-services.fake.json as fallback"
            cp ci/google-services.fake.json app/google-services.json
          fi

      - name: Setup local.properties with TMDB Secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          echo "tmdb.api.key=${TMDB_API_KEY:-[REDACTED_API_KEY]}" >> local.properties
          echo "tmdb.read.access.token=${TMDB_READ_ACCESS_TOKEN}" >> local.properties

      - name: Build Minified Release APK & Bundle
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Build Instrumented Test APKs for Test Lab
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Archive Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Archive Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7

      - name: Archive ProGuard / R8 Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 7

      - name: Archive Test APKs for Test Lab
        uses: actions/upload-artifact@v4
        with:
          name: test-lab-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7

  test-lab:
    name: Firebase Test Lab UI Tests
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Test APKs
        uses: actions/download-artifact@v4
        with:
          name: test-lab-apks
          path: apks

      - name: Authenticate to Google Cloud
        id: gcp_auth
        if: env.GCP_SA_KEY != ''
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.gcp_auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Test Lab (Instrumentation Tests)
        if: steps.gcp_auth.outcome == 'success'
        run: |
          gcloud --quiet config set project marvel-comics-app-86f2a
          gcloud firebase test android run \
            --type instrumentation \
            --app apks/app/build/outputs/apk/debug/app-debug.apk \
            --test apks/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=oriole,version=33,locale=pt_BR,orientation=portrait \
            --timeout 15m

      - name: Test Lab Fallback Notice
        if: env.GCP_SA_KEY == ''
        run: |
          echo "Notice: 'GCP_SA_KEY' secret not configured in repository."
          echo "Firebase Test Lab remote execution was skipped. Configure GCP_SA_KEY with Firebase Test Lab Admin privileges to enable automated cloud device testing."

  deploy-and-release:
    name: Firebase App Tester & Release Tag
    needs: [build, test-lab]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-apk

      - name: Download Release Bundle
        uses: actions/download-artifact@v4
        with:
          name: app-release-bundle
          path: release-bundle

      - name: Download R8 Mapping
        uses: actions/download-artifact@v4
        with:
          name: mapping-release
          path: release-mapping

      - name: Deploy to Firebase App Distribution (App Tester)
        if: env.FIREBASE_APP_ID != '' && (env.FIREBASE_CLI_TOKEN != '' || env.FIREBASE_SERVICE_ACCOUNT != '')
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_CLI_TOKEN }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: release-apk/app-release.apk
          releaseNotes: |
            Release automated from main (commit ${{ github.sha }})
            Commit: ${{ github.event.head_commit.message }}

      - name: Calculate Release Tag
        id: tag_calc
        run: |
          BASE_VERSION="1.0.0"
          if git rev-parse "v${BASE_VERSION}" >/dev/null 2>&1; then
            TAG="v${BASE_VERSION}-build.${{ github.run_number }}"
          else
            TAG="v${BASE_VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Using release tag: ${TAG}"

      - name: Create Git Release Tag
        env:
          TAG: ${{ steps.tag_calc.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automated Release $TAG from main (commit ${{ github.sha }})"
          git push origin "$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_calc.outputs.tag }}
          name: Release ${{ steps.tag_calc.outputs.tag }}
          body: |
            ## Automated Release ${{ steps.tag_calc.outputs.tag }}
            
            **Commit:** ${{ github.sha }}  
            **Branch:** `main`  
            
            ### Quality Gates Passed:
            - Detekt: 0 code smells
            - Android Lint: 0 errors
            - Unit Tests: 100% passing (218 tests)
            - Release APK minified with R8 (2.5 MB)
            - Deployed to Firebase App Distribution (group: `testers`)
          files: |
            release-apk/app-release.apk
            release-bundle/app-release.aab
            release-mapping/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
