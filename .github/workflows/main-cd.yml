name: Main CD Pipeline (Test Lab, App Distribution & Release)

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 3 * * *' # Nightly execution at 03:00 UTC
  workflow_dispatch:
    inputs:
      override_test_lab:
        description: "Bypass Firebase Test Lab failure (e.g. quota exhausted)"
        required: false
        type: boolean
        default: false
      run_test_lab:
        description: "Run Firebase Test Lab instrumentation suite"
        required: false
        type: boolean
        default: false

concurrency:
  group: cd-main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Copy fake google-services.json for CI
        run: |
          mkdir -p app
          cp ci/google-services.fake.json app/google-services.json

      - name: Setup local.properties with TMDB Secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          echo "tmdb.api.key=${TMDB_API_KEY}" >> local.properties
          echo "tmdb.read.access.token=${TMDB_READ_ACCESS_TOKEN}" >> local.properties

      - name: Run Detekt, Lint, Coverage & Benchmark Assembly
        run: ./gradlew detekt lintDebug testDebugUnitTest koverXmlReport koverHtmlReport :benchmark:assembleBenchmark --stacktrace

      - name: Upload Kover Coverage Report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: kover-coverage-report
          path: build/reports/kover/

  build:
    name: Build Release & Test APKs
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_B64 secret is missing in production CD pipeline!"
            exit 1
          fi
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "::error::FIREBASE_APP_ID secret is missing in production CD pipeline!"
            exit 1
          fi
          mkdir -p app
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          python3 ci/validate_google_services.py app/google-services.json

      - name: Setup local.properties with TMDB Secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          echo "tmdb.api.key=${TMDB_API_KEY}" >> local.properties
          echo "tmdb.read.access.token=${TMDB_READ_ACCESS_TOKEN}" >> local.properties

      - name: Setup Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing in production CD pipeline!"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV

      - name: Build Minified Release APK & Bundle
        env:
          CI_RELEASE_BUILD: "true"
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease -Pandroid.injected.version.code=${{ github.run_number }} --stacktrace

      - name: Clean up Keystore
        if: always()
        run: rm -f release.keystore

      - name: Build Instrumented Test APKs for Test Lab
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Scan Release Artifacts for Secret Leaks
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          mkdir -p /tmp/apk_inspect /tmp/aab_inspect
          unzip -q app/build/outputs/apk/release/*.apk -d /tmp/apk_inspect
          unzip -q app/build/outputs/bundle/release/*.aab -d /tmp/aab_inspect

          LEAK_FOUND=0
          for secret in "$TMDB_API_KEY" "$TMDB_READ_ACCESS_TOKEN"; do
            if [ -n "$secret" ]; then
              if grep -r -F "$secret" /tmp/apk_inspect/ >/dev/null 2>&1; then
                echo "::error::Plaintext secret leaked inside release APK!"
                LEAK_FOUND=1
              fi
              if grep -r -F "$secret" /tmp/aab_inspect/ >/dev/null 2>&1; then
                echo "::error::Plaintext secret leaked inside release AAB!"
                LEAK_FOUND=1
              fi
            fi
          done
          rm -rf /tmp/apk_inspect /tmp/aab_inspect
          if [ $LEAK_FOUND -ne 0 ]; then
            exit 1
          fi
          echo "Release artifact leak scan passed: 0 raw secrets found."

      - name: Stage Artifacts
        run: |
          mkdir -p stage/release stage/test-lab stage/bundle stage/mapping
          cp app/build/outputs/apk/release/*.apk stage/release/app-release.apk
          cp app/build/outputs/bundle/release/*.aab stage/bundle/
          cp app/build/outputs/mapping/release/mapping.txt stage/mapping/mapping.txt
          cp app/build/outputs/apk/debug/app-debug.apk stage/test-lab/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk stage/test-lab/app-debug-androidTest.apk

      - name: Archive Release APK
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: app-release-apk
          path: stage/release/app-release.apk
          retention-days: 7

      - name: Archive Release Bundle (AAB)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: app-release-bundle
          path: stage/bundle/*.aab
          retention-days: 7

      - name: Archive ProGuard / R8 Mapping File
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: mapping-release
          path: stage/mapping/mapping.txt
          retention-days: 7

      - name: Archive Test APKs for Test Lab
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: test-lab-apks
          path: stage/test-lab/*.apk
          retention-days: 7

  test-lab:
    name: Firebase Test Lab UI Tests
    needs: [build]
    if: |
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_test_lab == true || inputs.override_test_lab == true))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Test APKs
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: test-lab-apks
          path: apks

      - name: Authenticate to Google Cloud
        id: gcp_auth
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.gcp_auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Run Firebase Test Lab (Instrumentation Tests)
        if: steps.gcp_auth.outcome == 'success'
        run: |
          gcloud --quiet config set project marvel-comics-app-86f2a

          set +e
          echo "Running Firebase Test Lab on virtual device (MediumPhone.arm, API 33)..."
          OUTPUT=$(gcloud firebase test android run \
            --type instrumentation \
            --app apks/app-debug.apk \
            --test apks/app-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=33,locale=pt_BR,orientation=portrait \
            --timeout 15m 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          if [ $EXIT_CODE -ne 0 ] && echo "$OUTPUT" | grep -q "TEST_QUOTA_EXCEEDED"; then
            echo "Virtual device quota exceeded. Attempting physical device (oriole, API 33)..."
            OUTPUT=$(gcloud firebase test android run \
              --type instrumentation \
              --app apks/app-debug.apk \
              --test apks/app-debug-androidTest.apk \
              --device model=oriole,version=33,locale=pt_BR,orientation=portrait \
              --timeout 15m 2>&1)
            EXIT_CODE=$?
            echo "$OUTPUT"
          fi

          # Print test result XML from GCS if available
          GCS_URL=$(echo "$OUTPUT" | grep -o 'https://console.developers.google.com/storage/browser/[^ ]*' | head -1 | tr -d ']')
          if [ -n "$GCS_URL" ]; then
            GCS_PATH=$(echo "$GCS_URL" | sed 's|https://console.developers.google.com/storage/browser/|gs://|')
            echo "Fetching test execution results from $GCS_PATH..."
            gcloud storage ls --recursive "$GCS_PATH" || true
            for file in $(gcloud storage ls --recursive "${GCS_PATH}" 2>/dev/null | grep '\.xml$'); do
              echo "=== Test Result: $file ==="
              gcloud storage cat "$file" || true
            done
          fi

          if [ $EXIT_CODE -ne 0 ]; then
            if [ "${{ inputs.override_test_lab }}" == "true" ]; then
              echo "::warning title=Test Lab Override::Bypassing Test Lab failure due to explicit workflow_dispatch override."
            else
              echo "::error title=Firebase Test Lab Failed::Instrumentation tests failed (exit code $EXIT_CODE)."
              exit $EXIT_CODE
            fi
          fi

      - name: Test Lab Notice
        if: env.GCP_SA_KEY == ''
        run: |
          echo "Notice: 'GCP_SA_KEY' secret not configured in repository."
          echo "Firebase Test Lab remote execution was skipped."

  deploy-and-release:
    name: Firebase App Tester & Release Tag
    needs: [build, test-lab]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.test-lab.result == 'success' || needs.test-lab.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download Release APK
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: app-release-apk
          path: release-apk

      - name: Download Release Bundle
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: app-release-bundle
          path: release-bundle

      - name: Validate Firebase App Distribution Credentials
        if: env.FIREBASE_APP_ID == '' || env.FIREBASE_SERVICE_ACCOUNT == ''
        run: |
          echo "::warning::Firebase App Distribution credentials missing (FIREBASE_APP_ID or FIREBASE_SERVICE_ACCOUNT). Deployment to testers cannot run."

      - name: Deploy to Firebase App Distribution (App Tester)
        id: firebase_dist
        if: env.FIREBASE_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: release-apk/app-release.apk
          releaseNotes: |
            Release automated from main (commit ${{ github.sha }})
            Commit: ${{ github.event.head_commit.message }}

      - name: Determine Distribution Status Note
        id: dist_note
        run: |
          if [ "${{ steps.firebase_dist.outcome }}" = "success" ]; then
            echo "status=- Deployed to Firebase App Distribution (group: \`testers\`)" >> $GITHUB_OUTPUT
          else
            echo "status=- Firebase App Distribution: Skipped (missing credentials)" >> $GITHUB_OUTPUT
          fi

      - name: Calculate Release Tag
        id: tag_calc
        run: |
          BASE_VERSION="1.0.0"
          if git rev-parse "v${BASE_VERSION}" >/dev/null 2>&1; then
            TAG="v${BASE_VERSION}-build.${{ github.run_number }}"
          else
            TAG="v${BASE_VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Using release tag: ${TAG}"

      - name: Create Git Release Tag
        env:
          TAG: ${{ steps.tag_calc.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automated Release $TAG from main (commit ${{ github.sha }})"
          git push origin "$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.tag_calc.outputs.tag }}
          name: Release ${{ steps.tag_calc.outputs.tag }}
          body: |
            ## Automated Release ${{ steps.tag_calc.outputs.tag }}
            
            **Commit:** ${{ github.sha }}  
            **Branch:** `main`  
            
            ### Quality Gates Passed:
            - Detekt: 0 code smells
            - Android Lint: 0 errors
            - Unit Tests: 100% passing
            - Release APK minified with R8 (2.5 MB)
            ${{ steps.dist_note.outputs.status }}
          files: |
            release-apk/app-release.apk
            release-bundle/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
